<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cent2sat</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to original or modernized CSS -->
</head>
<body>
    <pre id="display">
# cent2sat
### cent to satoshi
World's smallest currency converter!
(Click on coin for next currency)
    </pre>

    <script>
        const currencies = [
            { code: 'USD', symbol: '$', unit: 0.01 },
            { code: 'EUR', symbol: '€', unit: 0.01 },
            { code: 'GBP', symbol: '£', unit: 0.01 },
            { code: 'CAD', symbol: '$', unit: 0.01 },
            { code: 'CNY', symbol: '¥', unit: 0.01 },
            { code: 'JPY', symbol: '¥', unit: 1 }  // JPY uses whole yen as the "small unit" since no cents
        ];

        let currentIndex = 0;
        let prices = {};

        const displayElement = document.getElementById('display');

        async function fetchPrices() {
            try {
                const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd,eur,gbp,cad,cny,jpy');
                if (!response.ok) throw new Error('API error');
                prices = await response.json();
                updateDisplay();
            } catch (error) {
                displayElement.textContent += 'Error loading prices. Please refresh.\n';
            }
        }

        function calculateSats(currency) {
            const price = prices.bitcoin[currency.code.toLowerCase()];
            if (!price) return 'N/A';
            const sats = Math.round(currency.unit / price * 100_000_000);
            return sats;
        }

        function updateDisplay() {
            const currency = currencies[currentIndex];
            const sats = calculateSats(currency);
            const unitStr = currency.unit.toFixed(currency.code === 'JPY' ? 0 : 2);
            displayElement.textContent = `
# cent2sat
### cent to satoshi
World's smallest currency converter!
(Click on coin for next currency)
# ${currency.symbol}${unitStr} ## ${currency.code} # ${sats} ## Satoshi
            `;
        }

        // Cycle currencies on click (attach to the whole pre for simplicity; original likely targets "coin")
        displayElement.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % currencies.length;
            updateDisplay();
        });

        // Initial fetch
        fetchPrices();
    </script>
</body>
</html>
